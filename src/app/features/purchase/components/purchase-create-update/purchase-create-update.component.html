<sb-layout-dashboard>
    <sb-dashboard-head title="Cadastro de Compra" [hideBreadcrumbs]="false"></sb-dashboard-head>
    <div class="signup-content">
        <div class="signup-form">
            <form [formGroup]="purchaseForm" class="register-form" id="purchaseForm" (ngSubmit)="save()">

                <div class="form-group">
                    <label for="place">Local:<span class="attention">*</span> </label>
                    <input type="text" name="place" id="place" formControlName="place" required />
                    <h6 *ngIf="errorPlace" class="attention"> {{messagePlace}}</h6>
                </div>

                <div class="form-group">
                    <label for="Descrição">Descrição:<span class="attention">*</span> </label>
                    <input type="text" name="Descrição" id="Descrição" formControlName="description" required />
                    <h6 *ngIf="errorDescription" class="attention"> {{messageDescription}}</h6>
                </div>

                <div class="form-group">
                    <label for="value">Valor:<span class="attention">*</span> </label>
                    <input type="text" name="value" id="value" currencyMask
                        [options]="{ prefix: 'R$ ', thousands: '.', decimal: ',' }" formControlName="value" required />
                    <h6 *ngIf="errorValue" class="attention"> {{messageValue}}</h6>
                </div>

                <div class="form-group">
                    <label for="purchaseDate">Data da Compra:<span class="attention">*</span> </label>
                    <input type="date" name="purchaseDate" id="purchaseDate" formControlName="purchaseDate"
                        required />
                    <h6 *ngIf="errorPurchaseDate" class="attention"> {{messagePurchaseDate}}</h6>
                </div>

                <div class="form-group">
                    <label for="purchaseFile">Imagem do Recibo da Compra:</label>
                    <input type="file" class="form-control-file" id="purchaseFile" aria-describedby="arquivoCompra"
                        placeholder="Imagem do Recibo da Compra" (change)="upload($event)">                    
                </div>
                <div class="preview" *ngIf="imgFile">
                    <img [src]="imgFile" style="width:150px; height:150px">
                </div>

                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary mt-4">Salvar</button>
                    <button type="button" (click)="clean()" class="btn btn-secondary mt-4 ml-2">Limpar</button>
                    <button type="button" [routerLink]="['/purchase/purchase-search']"
                        class="btn btn-secondary mt-4 ml-2">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</sb-layout-dashboard>
