<sb-layout-dashboard>
    <sb-dashboard-head title="Relatório de Compras" [hideBreadcrumbs]="false"></sb-dashboard-head>
    <sb-card>
        <div class="card-body">
            <form>
                <div class="row">
                    <div class="col-xl-6 col-md-6">
                        <div class="form-group">
                            <label for="startDate">Data da Inicio: </label>
                            <input type="date" name="startDate" id="startDate" [(ngModel)]="startDate" />
                        </div>
                    </div>
                    <div class="col-xl-6 col-md-6">
                        <div class="form-group">
                            <label for="endDate">Data de Fim: </label>
                            <input type="date" name="endDate" id="endDate" [(ngModel)]="endDate" />

                        </div>
                    </div>
                </div>
                <button type="button" (click)="search()" class="button-seach btn btn-primary"><i
                        class="fas fa-search"></i>&nbsp;Pesquisar</button>
            </form>
        </div>
    </sb-card>
    <sb-card>
        <div class="card-body">
            <button type="button" (click)="generatePdf()" class="btn btn-success">
                <i class="fas fa-file-alt"></i>&nbsp;Gerar Relatório</button>
            <br />
            <br />
            <table class="table table-striped">
                <thead class="thd">
                    <tr class="fir">
                        <th scope="col">Local</th>
                        <th scope="col">Descriçao</th>
                        <th scope="col">Valor</th>
                        <th scope="col">Data</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let p of purchases">
                        <td>
                            {{ p.place | uppercase  }}
                        </td>
                        <td>
                            {{ p.description | uppercase  }}
                        </td>
                        <td>
                            {{ p.value | currency:'BRL':'symbol':'0.2-2':'pt' }}
                        </td>
                        <td>
                            {{ p.purchaseDate | date : 'dd/MM/yyyy' }}
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="d-flex justify-content-between p-2">
                <ngb-pagination [collectionSize]="collectionSize" [(page)]="page" [pageSize]="pageSize"
                    (pageChange)="pagination()">
                </ngb-pagination>
            </div>
        </div>
    </sb-card>

</sb-layout-dashboard>
