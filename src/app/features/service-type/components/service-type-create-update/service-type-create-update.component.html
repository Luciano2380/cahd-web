<sb-layout-dashboard>
  <sb-dashboard-head title="Cadastro de Complementos" [hideBreadcrumbs]="false"></sb-dashboard-head>
  <div class="signup-content">
    <div class="signup-form">
      <form [formGroup]="serviceTypeForm" class="register-form" id="serviceTypeForm" (ngSubmit)="save()">
        <div class="form-group">
          <label for="name">Nome do Complemento <span class="attention">*</span> :</label>
          <input type="text" name="name" id="name" formControlName="name" required />
          <h6 *ngIf="errorName" class="attention"> {{messageName}}</h6>
        </div>
        <div class="form-group">
          <label for="address">Preço para Veiculo Pequeno <span class="attention">*</span> :</label>
          <input type="text" name="priceSmall" id="priceSmall" currencyMask
            [options]="{ prefix: 'R$ ', thousands: '.', decimal: ',' }" formControlName="priceSmall" required />
          <h6 *ngIf="errorPriceSmall" class="attention"> {{messagePriceSmall}}</h6>
        </div>
        <div class="form-group">
          <label for="address">Preço para Veiculo Médio <span class="attention">*</span> :</label>
          <input type="text" name="priceMedium" id="priceMedium" currencyMask
            [options]="{ prefix: 'R$ ', thousands: '.', decimal: ',' }" formControlName="priceMedium" required />
          <h6 *ngIf="errorPriceMedium" class="attention"> {{messagePriceMedium}}</h6>
        </div>
        <div class="form-group">
          <label for="address">Preço para Veiculo Grande <span class="attention">*</span> :</label>
          <input type="text" name="priceLarge" id="priceLarge" currencyMask
            [options]="{ prefix: 'R$ ', thousands: '.', decimal: ',' }" formControlName="priceLarge" required />
          <h6 *ngIf="errorPriceLarge" class="attention"> {{messagePriceLarge}}</h6>
        </div>
        <div class="form-submit">
          <button type="submit" class="btn btn-primary mt-4">Salvar</button>
          <button type="button" (click)="clean()" class="btn btn-secondary mt-4 ml-2">Limpar</button>
          <button type="button" [routerLink]="['/service-type/service-type-search']"
            class="btn btn-secondary mt-4 ml-2">Cancelar</button>
        </div>
      </form>
      <ngx-spinner></ngx-spinner>
    </div>
  </div>
</sb-layout-dashboard>
