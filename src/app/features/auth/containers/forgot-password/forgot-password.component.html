<sb-layout-dashboard>
    <sb-dashboard-head title="Pesquisa de Usuários" [hideBreadcrumbs]="false"></sb-dashboard-head>
    <sb-card>
        <div class="card-body">
            <form>
                <div class="form-group">
                    <label for="name">Nome:</label>
                    <input type="text" name="name" id="name" [(ngModel)]="name" name="name" />
                </div>
                <button type="button" (click)="search()" class="button-seach btn btn-primary"><i
                        class="fas fa-search"></i>&nbsp;Pesquisar</button>
            </form>
        </div>
    </sb-card>
    <sb-card>
        <div class="card-body">
            <button type="button" routerLink="/auth/register" class="btn btn-success">
                <i class="fas fa-plus"></i>&nbsp;Criar Novo Usuário</button>
            <br />
            <br />
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">Nome</th>
                        <th scope="col">Email</th> 
                        <th scope="col">Perfil</th>                             
                        <th scope="col">Opções</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let user of users">
                        <td>
                            {{ user.name }}
                        </td>   
                        <td>
                            {{ user.email }}
                        </td>  
                        <td>
                            {{ user.profile }}
                        </td>                     
                        <td>
                            <a (click)="edit(user.id)"><span class="edit"><i class="fas fa-edit"></i></span></a>
                            &nbsp;
                            <a (click)="delete(user)"><span class="delete"><i
                                        class="fas fa-trash-alt"></i></span></a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="d-flex justify-content-between p-2">
                <ngb-pagination [collectionSize]="collectionSize" [(page)]="page" [pageSize]="pageSize"
                    (pageChange)="pagination()">
                </ngb-pagination>
            </div>
        </div>
    </sb-card>


</sb-layout-dashboard>
