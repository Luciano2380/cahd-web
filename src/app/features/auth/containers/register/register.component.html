<sb-layout-dashboard>
    <sb-dashboard-head title="Cadastro de Usuários" [hideBreadcrumbs]="false"></sb-dashboard-head>
    <div class="signup-content">
        <div class="signup-form">
            <div class="card-body">
                <form [formGroup]="userForm" class="register-form" id="userForm" (ngSubmit)="save()">
                    <div class="form-group">
                        <label for="name">Nome Completo <span class="attention">*</span> :</label>
                        <input type="text" name="name" id="name" formControlName="name" required />
                        <h6 *ngIf="errorName" class="attention"> {{messageName}}</h6>
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail :</label>
                        <input class="form-control py-4" type="email" name="email" id="email" formControlName="email"
                            required />
                        <h6 *ngIf="errorEmail" class="attention"> {{messageEmail}}</h6>
                    </div>
                    <div class="form-group">
                        <label for="password">Senha <span class="attention">*</span>:</label>
                        <input type="password" name="password" id="password" formControlName="password" required />
                        <h6 *ngIf="errorPassword" class="attention"> {{messagePassword}}</h6>
                    </div>

                    <div class="form-group">
                        <label for="phone">Telefone <span class="attention">*</span> :</label>
                        <input type="text" name="telelefone" mask="(00) 00000-0000" formControlName="phone"
                            id="telelefone" />
                        <h6 *ngIf="errorPhone" class="attention"> {{messagePhone}}</h6>
                    </div>

                    <div class="form-group">
                        <label for="gender">Sexo
                            :</label>
                        <ng-select bindLabel="name" formControlName="gender">
                            <ng-option [value]="item.id" *ngFor="let item of genders">
                                {{item.name}}
                            </ng-option>
                        </ng-select>
                        <h6 *ngIf="errorGender" class="attention"> {{messageGender}}</h6>
                    </div>

                    <div class="form-group">
                        <label for="profile">Perfil
                            :</label>
                        <ng-select bindLabel="name" formControlName="profile">
                            <ng-option [value]="item.id" *ngFor="let item of profiles">
                                {{item.name}}
                            </ng-option>
                        </ng-select>
                        <h6 *ngIf="errorProfile" class="attention"> {{messageProfile}}</h6>
                    </div>


                    <div class="form-submit">
                        <button type="submit" class="btn btn-primary mt-4">Salvar</button>
                        <button type="button" [routerLink]="['/auth/forgot-password']"
                            class="btn btn-secondary mt-4 ml-2">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</sb-layout-dashboard>
