<sb-layout-auth>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card shadow-lg border-0 rounded-lg mt-5">
                    <div class="card-header">
                        <h3 class="text-center font-weight-light my-4">Login</h3>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="form-group"><label class="small mb-1" for="inputEmail">Email</label>
                                <input class="form-control py-4" id="inputEmail" type="email"
                                    [(ngModel)]="inputEmail" name="inputEmail" placeholder="Entre com seu e-mail" />
                                <h6 *ngIf="errorEmail" class="attention"> {{messageEmail}}</h6>
                            </div>
                            <div class="form-group"><label class="small mb-1" for="inputPassword">Senha</label>
                                <input class="form-control py-4" id="inputPassword" [(ngModel)]="inputPassword"
                                    type="password" name="inputPassword" placeholder="Entre com sua senha" />
                                <h6 *ngIf="errorPassword" class="attention"> {{messagePassword}}</h6>
                            </div>
                        </form>
                        <a class="btn btn-primary" (click)="login()">Login</a>                     
                       
                    </div>                   
                </div>
            </div>
        </div>
    </div>
</sb-layout-auth>
