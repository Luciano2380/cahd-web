<sb-layout-dashboard>
    <sb-dashboard-head title="Cadastro de Veiculos" [hideBreadcrumbs]="false"></sb-dashboard-head>
    <div class="signup-form">
        <form [formGroup]="vehicleForm" class="register-form" id="vehicleForm" (ngSubmit)="save()">

            <div class="form-group">
                <label for="name">Nome:<span class="attention">*</span> </label>
                <input type="text" name="name" id="place" formControlName="name" required />
                <h6 *ngIf="errorName" class="attention"> {{messageName}}</h6>
            </div>
            <div class="form-group">
                <label for="size">Tamanho do Veículo<span class="attention">*</span>
                    :</label>
                <ng-select [items]="sizeVehicle" bindLabel="name" bindValue="id" formControlName="size">
                </ng-select>
                <h6 *ngIf="errorSize" class="attention"> {{messageSize}}</h6>
            </div>

            <div class="form-submit">
                <button type="submit" class="btn btn-primary mt-4">Salvar</button>
                <button type="button" (click)="clean()" class="btn btn-secondary mt-4 ml-2">Limpar</button>
                <button type="button" [routerLink]="['/vehicle/vehicle-search']"
                    class="btn btn-secondary mt-4 ml-2">Cancelar</button>
            </div>
        </form>
    </div>
</sb-layout-dashboard>
