<sb-layout-dashboard>
    <sb-dashboard-head title="Pesquisa de Cor" [hideBreadcrumbs]="false"></sb-dashboard-head>
    <sb-card>
        <div class="card-body">
            <form>
                <div class="form-group">
                    <label for="name">Nome:</label>
                    <input type="text" name="name" id="name" [(ngModel)]="name" name="name" />
                </div>
                <button type="button" (click)="search()" class="button-seach btn btn-primary"><i
                        class="fas fa-search"></i>&nbsp;Pesquisar</button>
            </form>
        </div>
    </sb-card>
    <sb-card>
        <div class="card-body">
            <button type="button" routerLink="/color/color-create" class="btn btn-success">
                <i class="fas fa-plus"></i>&nbsp;Nova Cor</button>
            <br />
            <br />

            <table class="table table-striped">
                <thead class="thd">
                    <tr class="fir">
                        <th scope="col">Cor</th>
                        <th scope="col">Ação</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let color of colors">
                        <td>
                            {{ color.name | uppercase  }}
                        </td>
                        <td>
                            <a (click)="edit(color.id)"><span class="edit"><i class="fas fa-edit"></i></span></a>
                            &nbsp;
                            <a (click)="delete(color)"><span class="delete"><i
                                        class="fas fa-trash-alt"></i></span></a>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="d-flex justify-content-between p-2">
                <ngb-pagination [collectionSize]="collectionSize" [(page)]="page" [pageSize]="pageSize"
                    (pageChange)="pagination()">
                </ngb-pagination>
            </div>
        </div>
    </sb-card>
</sb-layout-dashboard>
